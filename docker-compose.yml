services:
  ai-service:
    build: ./ai-service
    image: blinksp/ai-chatbot:ai-service
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=lmstudio
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_MODEL=qwen/qwen3-14b
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  chatbot-ui:
    build: ./chatbot-ui
    image: blinksp/ai-chatbot:chatbot-ui
    ports:
      - "3000:3000"
    environment:
      - AI_SERVICE_URL=http://ai-service:8080/chat
    depends_on:
      - ai-service
    restart: unless-stopped
