services:
  ai-service:
    build: ./ai-service
    image: blinksp/ai-chatbot:ai-service
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=openai
      - LLM_BASE_URL=http://10.255.14.156:8080/v1
      - LLM_API_KEY=llama-cpp
      - LLM_MODEL=GLM-4.7-UD-Q2_K_XL
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  chatbot-ui:
    build: ./chatbot-ui
    image: blinksp/ai-chatbot:chatbot-ui
    ports:
      - "3000:3000"
    environment:
      - AI_SERVICE_URL=http://ai-service:8080/chat
    depends_on:
      - ai-service
    restart: unless-stopped
